name: pytest

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dynamic-graph-compiler/requirements.txt
          pip install pytest-asyncio  # matches [tool.pytest.ini_options] asyncio_mode
      - name: Run tests
        run: |
          cd dynamic-graph-compiler && python -m pytest tests/ -q
